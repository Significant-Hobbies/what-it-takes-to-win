<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c1c19" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="blue" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#7ea3d1"/>
      <stop offset="0.55" stop-color="#315f91"/>
      <stop offset="1" stop-color="#1c3556"/>
    </radialGradient>
    <radialGradient id="red" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#e0857a"/>
      <stop offset="0.55" stop-color="#a72e22"/>
      <stop offset="1" stop-color="#5e1810"/>
    </radialGradient>
    <radialGradient id="gold" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#e6c77a"/>
      <stop offset="0.55" stop-color="#b58b32"/>
      <stop offset="1" stop-color="#6a4f18"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#f2f0e7"/>
  <rect x="640" width="560" height="630" fill="#e8e7df"/>
  <rect x="640" width="560" height="630" fill="url(#grid)"/>
  <line x1="640" y1="0" x2="640" y2="630" stroke="#1c1c19" stroke-opacity="0.28"/>
  <line x1="0" y1="88" x2="1200" y2="88" stroke="#1c1c19" stroke-opacity="0.28"/>

  <text x="64" y="58" fill="#1c1c19" font-family="-apple-system, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.4">Look Sideways</text>
  <text x="1136" y="56" fill="#5f5c55" font-family="Menlo, 'SF Mono', monospace" font-size="12" letter-spacing="1.5" text-anchor="end">FIGURE 01 / 05</text>

  <text x="64" y="148" fill="#a72e22" font-family="-apple-system, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">A VISUAL ARGUMENT ABOUT SUCCESS</text>

  <g fill="#1c1c19" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif" font-size="60" letter-spacing="-1.8">
    <text x="60" y="230">Look sideways</text>
    <text x="60" y="300">for information,</text>
    <text x="60" y="370">never for a verdict.</text>
  </g>

  <g fill="#1c1c19" font-family="-apple-system, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="21" font-weight="600">
    <text x="64" y="430">Comparison keeps the finish and deletes</text>
    <text x="64" y="460">almost everything that produced it.</text>
  </g>

  <line x1="64" y1="512" x2="576" y2="512" stroke="#1c1c19" stroke-opacity="0.28"/>
  <text x="64" y="548" fill="#65635d" font-family="-apple-system, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="17">Their life is evidence about the world. It is not a verdict on yours.</text>
  <text x="64" y="582" fill="#5f5c55" font-family="Menlo, 'SF Mono', monospace" font-size="13" letter-spacing="0.5">paths.significanthobbies.com</text>

  <text x="700" y="140" fill="#1c1c19" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="26" font-style="italic">Same course, different conditions.</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M640 230 C 760 230, 800 360, 910 360 S 1030 500, 1160 470 L 1230 460" stroke="#1c1c19" stroke-width="96"/>
    <path d="M640 230 C 760 230, 800 360, 910 360 S 1030 500, 1160 470 L 1230 460" stroke="#e8e7df" stroke-width="88"/>
    <path d="M640 230 C 760 230, 800 360, 910 360 S 1030 500, 1160 470 L 1230 460" stroke="#e8e7df" stroke-width="88" stroke-opacity="0" />
    <path d="M640 230 C 760 230, 800 360, 910 360 S 1030 500, 1160 470 L 1230 460" stroke="#1c1c19" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="3 6"/>
    <line x1="905" y1="298" x2="972" y2="284" stroke="#a72e22" stroke-width="5"/>
    <line x1="828" y1="392" x2="868" y2="452" stroke="#315f91" stroke-width="5"/>
    <line x1="1060" y1="88" x2="960" y2="630" stroke="#ffffff" stroke-opacity="0.6" stroke-width="8"/>
  </g>

  <g fill="#e8e7df" stroke="#1c1c19" stroke-opacity="0.55" stroke-width="1.5">
    <circle cx="1078" cy="470" r="15"/>
    <circle cx="1122" cy="455" r="12"/>
    <circle cx="1162" cy="473" r="14"/>
  </g>

  <g>
    <circle cx="712" cy="238" r="21" fill="url(#gold)"/>
    <circle cx="746" cy="217" r="22" fill="url(#blue)"/>
    <circle cx="778" cy="234" r="21" fill="url(#red)"/>
    <ellipse cx="712" cy="262" rx="18" ry="4" fill="#1c1c19" fill-opacity="0.12"/>
    <ellipse cx="746" cy="242" rx="19" ry="4" fill="#1c1c19" fill-opacity="0.12"/>
    <ellipse cx="778" cy="258" rx="18" ry="4" fill="#1c1c19" fill-opacity="0.12"/>
  </g>

  <line x1="700" y1="520" x2="900" y2="520" stroke="#1c1c19" stroke-width="1.5"/>
  <text x="700" y="548" fill="#1c1c19" font-family="-apple-system, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6">THE VISIBLE FINISH</text>
  <text x="700" y="570" fill="#65635d" font-family="-apple-system, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="13">The remembered outcome hides every route</text>
  <text x="700" y="588" fill="#65635d" font-family="-apple-system, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="13">that disappeared.</text>
</svg>
