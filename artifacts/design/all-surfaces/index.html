<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Look Sideways — complete surface review</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #080b10;
        --panel: #10151f;
        --rule: #273247;
        --text: #f7f4ec;
        --muted: #9da8b8;
        --mint: #5fd3bc;
        --blue: #7c9cff;
        --frame-width: 390px;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--ink);
        color: var(--text);
      }

      header {
        position: sticky;
        z-index: 10;
        top: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 32px;
        align-items: end;
        padding: 28px clamp(20px, 4vw, 64px);
        border-bottom: 1px solid var(--rule);
        background: color-mix(in srgb, var(--ink) 92%, transparent);
        backdrop-filter: blur(18px);
      }

      .eyebrow,
      .meta,
      button,
      a {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--mint);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 54px);
        line-height: 0.98;
        letter-spacing: -0.045em;
      }

      .intro {
        max-width: 760px;
        margin: 12px 0 0;
        color: var(--muted);
        line-height: 1.55;
      }

      .viewport-picker {
        display: flex;
        gap: 7px;
      }

      button {
        min-height: 40px;
        padding: 0 13px;
        border: 1px solid var(--rule);
        border-radius: 5px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 11px;
      }

      button[aria-pressed="true"] {
        border-color: var(--blue);
        background: color-mix(in srgb, var(--blue) 12%, transparent);
        color: var(--text);
      }

      main {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--frame-width)), 1fr));
        gap: 28px;
        padding: 34px clamp(20px, 4vw, 64px) 72px;
      }

      article {
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: var(--panel);
      }

      .card-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: start;
        padding: 18px 20px;
        border-bottom: 1px solid var(--rule);
      }

      h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.02em;
      }

      .meta {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.5;
        text-transform: uppercase;
      }

      a {
        color: var(--blue);
        font-size: 11px;
        text-decoration: none;
      }

      .viewport {
        display: grid;
        place-items: start center;
        min-height: 680px;
        overflow: auto;
        background: #05070b;
      }

      iframe {
        width: min(100%, var(--frame-width));
        height: 680px;
        border: 0;
        background: #0b0d12;
      }

      @media (max-width: 800px) {
        header {
          position: static;
          grid-template-columns: 1fr;
        }

        .viewport-picker {
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">Impeccable review board · Preserve lane</p>
        <h1>Look Sideways, surface by surface.</h1>
        <p class="intro">Fifteen distinct public templates, shown live from the local Astro build. Generated person and comparison records inherit these templates and are sampled once each.</p>
      </div>
      <div class="viewport-picker" aria-label="Preview width">
        <button type="button" data-width="390" aria-pressed="true">390 · phone</button>
        <button type="button" data-width="768" aria-pressed="false">768 · tablet</button>
        <button type="button" data-width="1440" aria-pressed="false">1440 · desktop</button>
      </div>
    </header>
    <main id="surface-grid"></main>
    <script>
      const origin = "http://127.0.0.1:4321";
      const surfaces = [
        ["Canonical story", "/", "Persuade · five-chapter marble run"],
        ["Research overview", "/overview/", "Read · legacy evidence overview"],
        ["Research atlas", "/explore/", "Operate · filterable path records"],
        ["Insights", "/insights/", "Read · chart-led findings"],
        ["Evidence coverage", "/coverage/", "Read · ruled confidence ledger"],
        ["Methodology", "/methodology/", "Read · protocol and limitations"],
        ["Essay index", "/essays/", "Read · publication index"],
        ["Essay", "/essays/everyone-has-lost-their-marbles/", "Read · long-form argument"],
        ["ROI lab", "/roi/", "Operate · reconciled worksheet"],
        ["Compare", "/compare/", "Operate · path comparison chooser"],
        ["Person dossier", "/person/bill-gates/", "Read · evidence-first profile"],
        ["Am I the next?", "/am-i-the-next/bill-gates/", "Operate · bounded questionnaire"],
        ["About", "/about/", "Read · project framing"],
        ["Changelog", "/changelog/", "Read · publication history"],
        ["Not found", "/this-route-does-not-exist/", "Recover · custom 404"],
      ];

      const grid = document.querySelector("#surface-grid");
      for (const [title, route, description] of surfaces) {
        const card = document.createElement("article");
        card.innerHTML = `
          <div class="card-head">
            <div>
              <h2>${title}</h2>
              <p class="meta">${description}<br>${route}</p>
            </div>
            <a href="${origin}${route}" target="_blank" rel="noreferrer">Open live ↗</a>
          </div>
          <div class="viewport">
            <iframe loading="lazy" title="${title} preview" src="${origin}${route}"></iframe>
          </div>`;
        grid.append(card);
      }

      for (const button of document.querySelectorAll("[data-width]")) {
        button.addEventListener("click", () => {
          document.documentElement.style.setProperty("--frame-width", `${button.dataset.width}px`);
          for (const peer of document.querySelectorAll("[data-width]")) {
            peer.setAttribute("aria-pressed", String(peer === button));
          }
        });
      }
    </script>
  </body>
</html>
